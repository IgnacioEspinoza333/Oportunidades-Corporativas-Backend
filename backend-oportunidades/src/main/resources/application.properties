# Nombre del servicio y puerto
spring.application.name=backend-oportunidades
server.port=8080

# Base de datos H2 guardada en un archivo (los datos no se pierden al apagar el servidor)
spring.datasource.url=jdbc:h2:file:./data/oportunidades
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 para ver las tablas desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console