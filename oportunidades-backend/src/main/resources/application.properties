spring.application.name=oportunidades-backend
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/oportunidades_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:tu_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false